name: Data Processing Pipeline

on:
  push:
    branches: [ main, develop, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install pytest pytest-cov
            # BUG: Missing requirements.txt installation - DevOps should fix this
            # pip install -r requirements.txt
        
        - name: Run unit tests
          run: |
            # BUG: Wrong path for coverage - should be src/datalib not src/
            python -m pytest tests/ -v --cov=src/ --cov-report=xml    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
        - name: Install linting tools
          run: |
            python -m pip install --upgrade pip
            # BUG: Missing specific versions - should pin versions for reproducibility
            pip install flake8 black
        
        - name: Run Black formatter check
          run: |
            # BUG: Should exclude __pycache__ and other generated files
            black --check --diff src/ tests/ scripts/    - name: Run Flake8 linter
      run: |
        flake8 src/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
        - name: Test customer analysis script
          run: |
            # BUG: Path issue - should cd to correct directory first
            python analyze_customers.py ../data/customers.json    - name: Test report generation script
      run: |
        cd scripts
        python generate_report.py ../data/sales.json json
        python generate_report.py ../data/sales.json csv
        python generate_report.py ../data/sales.json txt
        
    - name: Verify output files
      run: |
        ls -la reports/
        echo "✅ All integration tests passed"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install security scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run Bandit security linter
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        
    - name: Run Safety check for vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [integration-test, security-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel
        
    - name: Create package structure
      run: |
        # Create a simple setup.py for packaging
        cat > setup.py << 'EOF'
        from setuptools import setup, find_packages
        
        setup(
            name="datalib",
            version="1.0.0",
            packages=find_packages(where="src"),
            package_dir={"": "src"},
            python_requires=">=3.8",
            author="Interview Team",
            description="Data processing library for technical interviews",
            long_description=open("README.md").read(),
            long_description_content_type="text/markdown",
        )
        EOF
        
    - name: Build package
      run: |
        python -m build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/

  deploy-simulation:
    name: Simulate Deployment
    runs-on: ubuntu-latest
    needs: [build-and-package]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-package
        path: dist/
        
    - name: Simulate deployment to staging
      run: |
        echo "🚀 Simulating deployment to staging environment..."
        echo "📦 Package files:"
        ls -la dist/
        echo "✅ Deployment to staging completed successfully"
        
    - name: Simulate health checks
      run: |
        echo "🔍 Running health checks on deployed application..."
        echo "✅ Health checks passed"
        echo "📊 Application metrics:"
        echo "   - Response time: 120ms"
        echo "   - Memory usage: 45MB"
        echo "   - CPU usage: 12%"
        
    - name: Simulate production deployment
      run: |
        echo "🌟 Simulating deployment to production environment..."
        echo "⏳ Waiting for approval... (simulated)"
        sleep 5
        echo "✅ Production deployment completed successfully"
        echo "🎉 Application is live at https://data-processing-app.example.com"

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-simulation]
    if: always()
    
    steps:
    - name: Deployment notification
      run: |
        if [ "${{ needs.deploy-simulation.result }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
          echo "🚀 New version deployed to production"
        else
          echo "❌ Pipeline failed or was cancelled"
          echo "🔧 Please check the logs and fix any issues"
        fi